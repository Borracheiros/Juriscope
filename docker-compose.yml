services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: juridico
      POSTGRES_PASSWORD: juridico
      POSTGRES_DB: juridico_ia
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juridico -d juridico_ia"]
      interval: 5s
      timeout: 5s
      retries: 10
