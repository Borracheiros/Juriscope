services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: juridico
      POSTGRES_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in the environment}
      POSTGRES_DB: juridico_ia
      JURIDICO_APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in the environment}
      JURIDICO_WORKER_PASSWORD: ${WORKER_PASSWORD:?set WORKER_PASSWORD in the environment}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juridico -d juridico_ia"]
      interval: 5s
      timeout: 5s
      retries: 10
